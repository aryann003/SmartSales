name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartsales_project
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartsales
          POSTGRES_USER: smartsales
          POSTGRES_PASSWORD: smartsales
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartsales"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://smartsales:smartsales@localhost:5432/smartsales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: smartsales_project/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

{% extends 'base.html' %} {% block content %}
<h2>Customers</h2>
<a href="{% url 'customer_add' %}" class="btn btn-primary mb-3"
  >+ Add Customer</a
>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Country</th>
      <th>Signup Date</th>
    </tr>
  </thead>
  <tbody>
    {% for c in customers %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.country }}</td>
      <td>{{ c.signup_date }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

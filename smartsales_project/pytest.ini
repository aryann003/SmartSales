[pytest]
DJANGO_SETTINGS_MODULE = smartsales_project.settings
python_files = tests.py test_*.py
addopts = -q --reuse-db
env =
    D:SECRET_KEY=test-secret-key-that-is-long-enough-0123456789
    D:DEBUG=False
    D:DATABASE_URL=postgres://smartsales:smartsales@localhost:5432/smartsales
    D:AUTOMATION_API_KEY=test-automation-key
    D:WEBHOOK_SECRET=test-webhook-secret
    D:N8N_WEBHOOK_URL=
    D:WEBHOOK_ASYNC=False
